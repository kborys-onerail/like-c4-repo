name: Architecture Pages

on:
  push:
    branches:
      - main
    paths:
      - '**/docs/likec4/**'
      - 'likec4.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/c4-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}#/view/index
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate architecture
        run: npm run validate

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build LikeC4 site
        run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4